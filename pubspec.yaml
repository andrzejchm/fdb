name: fdb
version: 1.6.0
description: Flutter Debug Bridge - CLI for AI agents to interact with running Flutter apps on device. Launch, reload, screenshot, inspect widget tree, filter logs.
repository: https://github.com/andrzejchm/fdb
environment:
  sdk: '>=3.3.0 <4.0.0'
executables:
  fdb: fdb
  fdb-controller: controller
dev_dependencies:
  dart_code_linter: ^4.0.3
  document_throws: ^0.3.0
  lints: ^6.1.0
  test: ^1.31.0
dependencies:
  args: ^2.7.0
  image: ^4.8.0
  pubspec_manager: ^3.2.1
  vm_service: 15.0.0
