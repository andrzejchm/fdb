group 'io.fdb.fdb_helper'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// No longer applies 'kotlin-android' directly: Flutter's Gradle plugin
// detects the absence of a Kotlin Gradle Plugin application and applies it
// for us on AGP < 9, and relies on AGP's Built-in Kotlin on AGP 9+. Applying
// it here ourselves (even behind an AGP-version guard) still trips Flutter's
// KGP deprecation warning, because that check is a regex over the raw
// build.gradle text and can't see the guard.
// See: https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-plugin-authors
apply plugin: 'com.android.library'

android {
    compileSdkVersion 34
    namespace 'io.fdb.fdb_helper'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        debug.java.srcDirs += 'src/debug/kotlin'
        release.java.srcDirs += 'src/release/kotlin'
    }

    // The Flutter Gradle plugin adds a `profile` build type to plugin projects,
    // so the plugin compiles its own `profile` variant (matchingFallbacks does
    // not apply). Give it the real (debug) implementation, as profile builds
    // are meant to support fdb. `configureEach` also covers source sets created
    // after this block is evaluated.
    sourceSets.configureEach { sourceSet ->
        if (sourceSet.name == 'profile') {
            sourceSet.java.srcDirs += 'src/debug/kotlin'
        }
    }

    defaultConfig {
        minSdkVersion 21
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}
